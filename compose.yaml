services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cloudrag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudrag -d cloudrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudrag-frontend
    ports:
      - "5173:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: