[project]
name = "cloudrag"
version = "0.1.0"
description = "A production-style cloud RAG application"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]