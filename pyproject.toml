[project]
name = "cloudrag"
version = "0.1.0"
description = "A production-style cloud RAG application"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.22",
    "prometheus-client==0.23.1",
    "requests",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "PyJWT",
    "Pillow",
]

[tool.setuptools.packages.find]
include = ["backend*"]